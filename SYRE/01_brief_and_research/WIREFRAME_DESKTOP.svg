<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <pattern id="dot-grid" patternUnits="userSpaceOnUse" width="4" height="4">
      <circle cx="2" cy="2" r="0.5" fill="#1a1a1a"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2d8a7a"/>
    </marker>
    <marker id="arrow-dim" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#050505"/>
  <rect width="1440" height="900" fill="url(#dot-grid)" opacity="0.3"/>

  <!-- Negative space zone (left) - annotation -->
  <rect x="64" y="100" width="256" height="700" fill="none" stroke="#2d8a7a" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
  <text x="192" y="460" fill="#2d8a7a" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.7">NEGATIVE</text>
  <text x="192" y="474" fill="#2d8a7a" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.7">SPACE</text>
  <text x="192" y="488" fill="#2d8a7a" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.7">~35-50%</text>

  <!-- Logo layer (z=1) - centered right -->
  <rect x="320" y="209" width="1000" height="482" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="820" y="420" fill="#fff" font-family="sans-serif" font-size="72" font-weight="bold" opacity="0.22" text-anchor="middle" letter-spacing="18">SYRE</text>
  <text x="820" y="470" fill="#666" font-family="monospace" font-size="10" text-anchor="middle" opacity="0.7">LOGO LAYER z=1 · opacity 0.22</text>
  <text x="820" y="485" fill="#666" font-family="monospace" font-size="10" text-anchor="middle" opacity="0.7">1000×482px · min(82vw,1000px)</text>

  <!-- Canvas frame field (z=2) - sample frames -->
  <g opacity="0.6">
    <!-- Frame 1: right-upper -->
    <rect x="680" y="120" width="140" height="40" rx="3" fill="none" stroke="#2d8a7a" stroke-width="1.5" transform="rotate(-15,750,140)"/>
    <text x="750" y="145" fill="#2d8a7a" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(-15,750,140)">frame</text>

    <!-- Frame 2: left-mid -->
    <rect x="200" y="380" width="130" height="38" rx="3" fill="none" stroke="#2d8a7a" stroke-width="1.5" transform="rotate(8,265,399)"/>
    <text x="265" y="404" fill="#2d8a7a" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(8,265,399)">frame</text>

    <!-- Frame 3: center-upper -->
    <rect x="560" y="200" width="135" height="42" rx="3" fill="none" stroke="#2d8a7a" stroke-width="1.5" transform="rotate(-5,627,221)"/>
    <text x="627" y="226" fill="#2d8a7a" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(-5,627,221)">frame</text>

    <!-- Frame 4: right-lower -->
    <rect x="900" y="520" width="145" height="40" rx="3" fill="none" stroke="#2d8a7a" stroke-width="1.5" transform="rotate(12,972,540)"/>
    <text x="972" y="545" fill="#2d8a7a" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(12,972,540)">frame</text>

    <!-- Frame 5: bottom-center -->
    <rect x="600" y="600" width="128" height="38" rx="3" fill="none" stroke="#2d8a7a" stroke-width="1.5" transform="rotate(-20,664,619)"/>
    <text x="664" y="624" fill="#2d8a7a" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(-20,664,619)">frame</text>

    <!-- Frame 6: left-upper -->
    <rect x="120" y="150" width="125" height="36" rx="3" fill="none" stroke="#2d8a7a" stroke-width="1.5" transform="rotate(18,182,168)"/>
    <text x="182" y="173" fill="#2d8a7a" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(18,182,168)">frame</text>

    <!-- Frame 7: mid-right -->
    <rect x="1050" y="300" width="140" height="42" rx="3" fill="none" stroke="#2d8a7a" stroke-width="1.5" transform="rotate(-8,1120,321)"/>
    <text x="1120" y="326" fill="#2d8a7a" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(-8,1120,321)">frame</text>

    <!-- Frame 8: top-center -->
    <rect x="500" y="60" width="120" height="35" rx="3" fill="none" stroke="#2d8a7a" stroke-width="1.5" transform="rotate(25,560,77)"/>
    <text x="560" y="82" fill="#2d8a7a" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(25,560,77)">frame</text>

    <!-- Frame 9: bottom-left -->
    <rect x="150" y="620" width="132" height="38" rx="3" fill="none" stroke="#2d8a7a" stroke-width="1.5" transform="rotate(-12,216,639)"/>
    <text x="216" y="644" fill="#2d8a7a" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(-12,216,639)">frame</text>

    <!-- Frame 10: right-bottom -->
    <rect x="1100" y="640" width="138" height="40" rx="3" fill="none" stroke="#2d8a7a" stroke-width="1.5" transform="rotate(7,1169,660)"/>
    <text x="1169" y="665" fill="#2d8a7a" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(7,1169,660)">frame</text>
  </g>

  <!-- Z-order callout -->
  <line x1="1050" y1="50" x2="1100" y2="50" stroke="#2d8a7a" stroke-width="1"/>
  <text x="1110" y="46" fill="#2d8a7a" font-family="monospace" font-size="10" opacity="0.8">Canvas z=2 (frames render above logo)</text>

  <!-- Zone A: Headline -->
  <rect x="64" y="60" width="480" height="50" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="74" y="90" fill="#ccc" font-family="sans-serif" font-size="24" letter-spacing="1">Only fun, only positive emotions</text>
  <text x="544" y="90" fill="#444" font-family="monospace" font-size="9">ZONE A (headline) · z=3</text>

  <!-- Zone B: Technical labels -->
  <rect x="64" y="800" width="260" height="60" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="74" y="822" fill="#555" font-family="monospace" font-size="11" letter-spacing="2">HAND-LAID CARBON</text>
  <text x="74" y="838" fill="#555" font-family="monospace" font-size="11" letter-spacing="2">CUSTOM FINISH</text>
  <text x="74" y="854" fill="#555" font-family="monospace" font-size="11" letter-spacing="2">REBRANDING 2026</text>
  <text x="334" y="835" fill="#444" font-family="monospace" font-size="9">ZONE B · z=3</text>

  <!-- Zone C: Hint -->
  <rect x="470" y="870" width="500" height="22" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="720" y="886" fill="#666" font-family="sans-serif" font-size="12" text-anchor="middle">Move cursor to nudge · Space to freeze · Hold S for 0.8s to reveal</text>
  <text x="980" y="886" fill="#444" font-family="monospace" font-size="9">ZONE C · z=3</text>

  <!-- Email/CTA zone -->
  <rect x="64" y="860" width="220" height="24" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <text x="74" y="877" fill="#444" font-family="sans-serif" font-size="11">email@example.com  [Notify me]</text>
  <text x="294" y="877" fill="#444" font-family="monospace" font-size="9">EMAIL/CTA · z=3</text>

  <!-- S-hold corridor annotation (dashed vertical) -->
  <line x1="720" y1="30" x2="720" y2="870" stroke="#2d8a7a" stroke-width="1" stroke-dasharray="3,8" opacity="0.25"/>
  <text x="850" y="50" fill="#2d8a7a" font-family="monospace" font-size="9" opacity="0.5">S-HOLD CORRIDOR (~250px wide, clears frames)</text>

  <!-- Dimension annotations -->
  <line x1="0" y1="895" x2="1440" y2="895" stroke="#333" stroke-width="1"/>
  <line x1="0" y1="892" x2="0" y2="898" stroke="#333" stroke-width="1"/>
  <line x1="1440" y1="892" x2="1440" y2="898" stroke="#333" stroke-width="1"/>
  <text x="720" y="900" fill="#333" font-family="monospace" font-size="10" text-anchor="middle">1440px</text>

  <!-- Frame field label -->
  <text x="10" y="30" fill="#2d8a7a" font-family="monospace" font-size="12" opacity="0.9">WIREFRAME_DESKTOP · 1440×900 · 10 frames · ~45% negative space</text>

  <!-- Legend -->
  <rect x="1100" y="6" width="330" height="10" fill="none" stroke="#444" stroke-width="1" opacity="0.3"/>
  <text x="1270" y="14" fill="#444" font-family="monospace" font-size="8" text-anchor="middle" opacity="0.5">─ LOGO z=1 · · · COPY z=3 · · · FRAMES z=2 · - - CORRIDOR</text>
</svg>
