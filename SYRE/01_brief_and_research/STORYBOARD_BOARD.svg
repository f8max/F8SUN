<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" width="1440" height="500">
  <rect width="1440" height="500" fill="#0a0a0a"/>
  <text x="20" y="30" fill="#2d8a7a" font-family="monospace" font-size="14">STORYBOARD — SYRE V2 Best Placeholder · One-Screen Temporal Sequence</text>

  <!-- State boxes -->
  <!-- 1. INITIAL -->
  <g transform="translate(20,50)">
    <rect width="260" height="420" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
    <rect width="260" height="28" rx="4" fill="#1a1a1a"/>
    <text x="130" y="19" fill="#2d8a7a" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">1. INITIAL (0-300ms)</text>
    <rect x="15" y="40" width="230" height="155" fill="#050505" rx="3" stroke="#333" stroke-width="0.5"/>
    <!-- Static logo -->
    <text x="130" y="110" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold" opacity="0.4" text-anchor="middle" letter-spacing="6">SYRE</text>
    <!-- One frame -->
    <rect x="100" y="72" width="60" height="16" rx="2" fill="none" stroke="#2d8a7a" stroke-width="1" transform="rotate(-8,130,80)"/>
    <!-- Headline -->
    <text x="130" y="135" fill="#888" font-family="sans-serif" font-size="8" text-anchor="middle" opacity="0.7">Only fun, only positive</text>
    <text x="130" y="146" fill="#888" font-family="sans-serif" font-size="8" text-anchor="middle" opacity="0.7">emotions</text>
    <!-- Hint -->
    <text x="130" y="180" fill="#555" font-family="monospace" font-size="7" text-anchor="middle">nudge · Space · hold S</text>

    <!-- Annotations -->
    <text x="130" y="210" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Static poster</text>
    <text x="130" y="224" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ No-JS fallback</text>
    <text x="130" y="238" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ One curated frame</text>
    <text x="130" y="252" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ All DOM content</text>

    <text x="130" y="290" fill="#2d8a7a" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">REQUIREMENT:</text>
    <text x="130" y="306" fill="#777" font-family="sans-serif" font-size="8" text-anchor="middle">Logo + frame-01.png</text>
    <text x="130" y="320" fill="#777" font-family="sans-serif" font-size="8" text-anchor="middle">visible without JS</text>

    <line x1="15" y1="350" x2="245" y2="350" stroke="#333" stroke-width="0.5"/>
    <text x="130" y="372" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Canvas: hidden</text>
    <text x="130" y="388" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Poster: active</text>
    <text x="130" y="404" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Hint: visible</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="280" y1="260" x2="310" y2="260" stroke="#2d8a7a" stroke-width="2" marker-end="url(#arrow-sb)"/>
  <defs><marker id="arrow-sb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2d8a7a"/></marker></defs>

  <!-- 2. ACTIVE -->
  <g transform="translate(320,50)">
    <rect width="260" height="420" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
    <rect width="260" height="28" rx="4" fill="#1a1a1a"/>
    <text x="130" y="19" fill="#2d8a7a" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">2. ACTIVE (300ms+)</text>
    <rect x="15" y="40" width="230" height="155" fill="#050505" rx="3" stroke="#333" stroke-width="0.5"/>
    <!-- Logo -->
    <text x="130" y="100" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold" opacity="0.22" text-anchor="middle" letter-spacing="6">SYRE</text>
    <!-- Multiple frames appearing -->
    <rect x="40" y="60" width="55" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(-12,67,67)" opacity="0.4"/>
    <rect x="160" y="55" width="50" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(15,185,62)" opacity="0.5"/>
    <rect x="80" y="90" width="52" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(-8,106,97)" opacity="0.7"/>
    <rect x="140" y="85" width="48" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(10,164,92)" opacity="0.6"/>
    <rect x="50" y="130" width="50" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(-5,75,137)" opacity="0.8"/>
    <rect x="150" y="125" width="55" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(8,177,132)" opacity="0.75"/>
    <!-- Fade-in label -->
    <text x="130" y="170" fill="#888" font-family="monospace" font-size="7" text-anchor="middle">↑ frames fade in 0→0.75 over 600ms</text>

    <!-- Annotations -->
    <text x="130" y="205" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Canvas activates</text>
    <text x="130" y="219" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ 10 frames enter</text>
    <text x="130" y="233" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Brownian drift begins</text>
    <text x="130" y="247" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Logo occlusion starts</text>

    <text x="130" y="290" fill="#2d8a7a" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">TRANSITION:</text>
    <text x="130" y="306" fill="#777" font-family="sans-serif" font-size="8" text-anchor="middle">Poster → Canvas</text>
    <text x="130" y="320" fill="#777" font-family="sans-serif" font-size="8" text-anchor="middle">Opacity 0→0.75</text>

    <line x1="15" y1="350" x2="245" y2="350" stroke="#333" stroke-width="0.5"/>
    <text x="130" y="372" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Canvas: running</text>
    <text x="130" y="388" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Hint: fading</text>
    <text x="130" y="404" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Frames: 10 active</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="580" y1="260" x2="610" y2="260" stroke="#2d8a7a" stroke-width="2" marker-end="url(#arrow-sb)"/>

  <!-- 3. INTERACTION -->
  <g transform="translate(620,50)">
    <rect width="260" height="420" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
    <rect width="260" height="28" rx="4" fill="#1a1a1a"/>
    <text x="130" y="19" fill="#2d8a7a" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">3. INTERACTION (2s+)</text>
    <rect x="15" y="40" width="230" height="155" fill="#050505" rx="3" stroke="#333" stroke-width="0.5"/>
    <!-- Logo with frames moving -->
    <text x="130" y="100" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold" opacity="0.22" text-anchor="middle" letter-spacing="6">SYRE</text>
    <!-- Frames in drift positions -->
    <rect x="30" y="48" width="52" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="1" transform="rotate(-18,56,55)" opacity="0.75"/>
    <rect x="170" y="58" width="48" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="1" transform="rotate(22,194,65)" opacity="0.75"/>
    <rect x="60" y="95" width="50" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="1" transform="rotate(-10,85,102)" opacity="0.75"/>
    <rect x="150" y="88" width="54" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="1" transform="rotate(14,177,95)" opacity="0.75"/>
    <rect x="40" y="127" width="48" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="1" transform="rotate(-6,64,134)" opacity="0.75"/>
    <rect x="155" y="120" width="50" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="1" transform="rotate(9,180,127)" opacity="0.75"/>
    <!-- Cursor -->
    <circle cx="90" cy="142" r="4" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <!-- Drift arrows -->
    <line x1="50" y1="55" x2="58" y2="55" stroke="#2d8a7a" stroke-width="0.5" opacity="0.4"/>
    <line x1="170" y1="65" x2="162" y2="65" stroke="#2d8a7a" stroke-width="0.5" opacity="0.4"/>

    <!-- Annotations -->
    <text x="130" y="205" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Cursor nudge active</text>
    <text x="130" y="219" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Hint fully hidden</text>
    <text x="130" y="233" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Logo revealed/occluded</text>
    <text x="130" y="247" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Frames drift laterally</text>

    <text x="130" y="290" fill="#2d8a7a" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">PRIMARY EXPERIENCE:</text>
    <text x="130" y="306" fill="#777" font-family="sans-serif" font-size="8" text-anchor="middle">Gentle, controlled,</text>
    <text x="130" y="320" fill="#777" font-family="sans-serif" font-size="8" text-anchor="middle">engineered motion</text>

    <line x1="15" y1="350" x2="245" y2="350" stroke="#333" stroke-width="0.5"/>
    <text x="130" y="372" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Canvas: running</text>
    <text x="130" y="388" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Hint: hidden</text>
    <text x="130" y="404" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Mouse: tracking</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="880" y1="260" x2="910" y2="260" stroke="#2d8a7a" stroke-width="2" marker-end="url(#arrow-sb)"/>

  <!-- 4. FREEZE -->
  <g transform="translate(920,50)">
    <rect width="260" height="420" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
    <rect width="260" height="28" rx="4" fill="#1a1a1a"/>
    <text x="130" y="19" fill="#2d8a7a" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">4. FREEZE</text>
    <rect x="15" y="40" width="230" height="155" fill="#050505" rx="3" stroke="#333" stroke-width="0.5"/>
    <!-- Frozen frames + logo -->
    <text x="130" y="100" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold" opacity="0.22" text-anchor="middle" letter-spacing="6">SYRE</text>
    <!-- Frames frozen in place -->
    <rect x="35" y="52" width="50" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(-15,60,59)" opacity="0.5"/>
    <rect x="165" y="55" width="48" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(18,189,62)" opacity="0.5"/>
    <rect x="55" y="95" width="52" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(-8,81,102)" opacity="0.5"/>
    <rect x="150" y="90" width="50" height="14" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(12,175,97)" opacity="0.5"/>
    <!-- Freeze indicator -->
    <rect x="75" y="142" width="110" height="18" rx="9" fill="#1a1a1a" stroke="#2d8a7a" stroke-width="0.8"/>
    <text x="130" y="155" fill="#2d8a7a" font-family="monospace" font-size="8" text-anchor="middle">FROZEN</text>

    <!-- Annotations -->
    <text x="130" y="205" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Space key toggles</text>
    <text x="130" y="219" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Double-click toggles</text>
    <text x="130" y="233" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Frames hold position</text>
    <text x="130" y="247" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Toast notification</text>

    <text x="130" y="290" fill="#2d8a7a" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">TOGGLE:</text>
    <text x="130" y="306" fill="#777" font-family="sans-serif" font-size="8" text-anchor="middle">Freeze ⟷ Resume</text>
    <text x="130" y="320" fill="#777" font-family="sans-serif" font-size="8" text-anchor="middle">Toast: 2s duration</text>

    <line x1="15" y1="350" x2="245" y2="350" stroke="#333" stroke-width="0.5"/>
    <text x="130" y="372" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Canvas: frozen</text>
    <text x="130" y="388" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Toast: visible</text>
    <text x="130" y="404" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">State: preserved</text>
  </g>

  <!-- Arrow 4→5 -->
  <line x1="1180" y1="260" x2="1210" y2="260" stroke="#2d8a7a" stroke-width="2" marker-end="url(#arrow-sb)"/>

  <!-- 5. CORRIDOR -->
  <g transform="translate(1220,50)">
    <rect width="200" height="420" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
    <rect width="200" height="28" rx="4" fill="#1a1a1a"/>
    <text x="100" y="19" fill="#2d8a7a" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">5. S-HOLD</text>
    <rect x="10" y="40" width="180" height="155" fill="#050505" rx="3" stroke="#333" stroke-width="0.5"/>
    <!-- Cleared corridor -->
    <rect x="75" y="38" width="50" height="160" fill="#050505" stroke="#2d8a7a" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>
    <text x="100" y="100" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold" opacity="0.5" text-anchor="middle" letter-spacing="6">SYRE</text>
    <!-- Frames pushed aside -->
    <rect x="18" y="58" width="45" height="12" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(-10,40,64)" opacity="0.4"/>
    <rect x="135" y="52" width="45" height="12" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(12,157,58)" opacity="0.4"/>
    <rect x="20" y="110" width="42" height="12" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(-8,41,116)" opacity="0.4"/>
    <rect x="138" y="105" width="42" height="12" rx="2" fill="none" stroke="#2d8a7a" stroke-width="0.8" transform="rotate(15,159,111)" opacity="0.4"/>
    <!-- S key label -->
    <rect x="70" y="158" width="60" height="14" rx="3" fill="#2d8a7a" opacity="0.15"/>
    <text x="100" y="169" fill="#2d8a7a" font-family="monospace" font-size="9" text-anchor="middle">S HOLD 0.8s</text>

    <!-- Annotations -->
    <text x="100" y="205" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ S held 800ms</text>
    <text x="100" y="219" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Corridor clears</text>
    <text x="100" y="233" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Logo fully visible</text>
    <text x="100" y="247" fill="#444" font-family="monospace" font-size="8" text-anchor="middle">─ Dashed border fades in</text>

    <text x="100" y="290" fill="#2d8a7a" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">EASTER EGG:</text>
    <text x="100" y="306" fill="#777" font-family="sans-serif" font-size="8" text-anchor="middle">Release to let</text>
    <text x="100" y="320" fill="#777" font-family="sans-serif" font-size="8" text-anchor="middle">frames drift back</text>

    <line x1="10" y1="350" x2="190" y2="350" stroke="#333" stroke-width="0.5"/>
    <text x="100" y="372" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Corridor: active</text>
    <text x="100" y="388" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Border: #2d8a7a</text>
    <text x="100" y="404" fill="#444" font-family="monospace" font-size="7" text-anchor="middle">Width: ~250px</text>
  </g>

  <!-- Bottom row: key -->
  <g transform="translate(20,475)">
    <rect x="0" y="0" width="10" height="10" fill="#2d8a7a" opacity="0.5"/>
    <text x="14" y="9" fill="#666" font-family="monospace" font-size="9">C5 Drift mechanics (Brownian + nudge)</text>
    <rect x="320" y="0" width="10" height="10" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
    <text x="334" y="9" fill="#666" font-family="monospace" font-size="9">Logo layer (z=1, opacity 0.22)</text>
    <text x="620" y="9" fill="#555" font-family="monospace" font-size="9">↓ Frame → Corridor → Freeze: user interaction path →</text>
  </g>
</svg>
